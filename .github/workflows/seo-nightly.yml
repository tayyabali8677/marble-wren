name: SEO Nightly

# One job rather than one per agent, so the digest at the end can read every
# report and so the crawl-based agents share a single crawl. Every step after
# the first is `if: always()` and the slow ones have their own timeouts, so one
# agent failing or running long still leaves the rest of the night's work
# intact.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

# One master-writing workflow at a time. Both this and the "Run" content
# pipeline commit and push to master, so they share one concurrency group:
# whichever starts second queues until the first finishes instead of racing its
# push. cancel-in-progress is false so an in-flight run is never thrown away
# (this also covers a manual dispatch firing alongside the cron). The commit
# steps keep their push retry loops as a backstop for anything outside Actions.
concurrency:
  group: marble-wren-master-writes
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    # The capped steps alone (Indexing monitor 60 + Near-duplicate content 15
    # + Fee range corrections 35 + Mechanical SEO fixes 35 + Sitemap entry
    # corrections 65 + Image SEO 15 + Core Web Vitals 20) sum to 245 minutes,
    # so the job-level timeout must clear that on its own before any of the
    # ~18 uncapped steps (npm ci, the crawl-based audits, the digest, etc.)
    # get a minute of headroom. 300 gives ~55 minutes of slack for those and
    # stays well under GitHub Actions' 360-minute hard cap for hosted
    # runners. Whenever a step's own timeout-minutes changes, re-check this
    # sum still fits — GitHub Actions kills the whole job the instant this
    # elapses, mid-step, regardless of what any individual step's timeout
    # allows.
    timeout-minutes: 300
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci

      - name: Gap analysis and auto-publish
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          SITE_REPO_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
          SEO_AUTOPUBLISH: ${{ vars.SEO_AUTOPUBLISH }}
        run: npx tsx scripts/seo/seo-gap-agent.ts

      - name: Zero-click analysis
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: npx tsx scripts/seo/zero-click.ts

      - name: Indexing monitor
        if: always()
        timeout-minutes: 60
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: npx tsx scripts/seo/indexing-monitor.ts

      # The next several share one crawl of the site. link-health runs first so
      # it fills the cache the rest read.
      - name: Link health
        if: always()
        run: npx tsx scripts/seo/link-health.ts

      - name: Thin and placeholder content
        if: always()
        run: npx tsx scripts/seo/thin-content.ts

      - name: Structured data audit
        if: always()
        run: npx tsx scripts/seo/schema-audit.ts

      - name: Internal link graph
        if: always()
        run: npx tsx scripts/seo/internal-links.ts

      # Pairwise comparison of every page against every other, so it is the
      # slowest of the crawl-based agents by a distance.
      - name: Near-duplicate content
        if: always()
        timeout-minutes: 15
        run: npx tsx scripts/seo/duplicate-content.ts

      - name: Fact drift
        if: always()
        run: npx tsx scripts/seo/fact-drift.ts

      # verifyAndMaybeRollback now runs its checks concurrently via
      # Promise.all rather than sequentially, so the typical case is ~180s
      # (one polling round) regardless of MAX_FEE_FIXES_PER_RUN, not the old
      # N x 3 minute sequential worst case. 35 is kept as a generous upper
      # bound (not a tight estimate) so a runaway verification loop still
      # can't run past the job's overall timeout-minutes with the commit
      # already live and unreverted.
      - name: Fee range corrections
        if: always()
        timeout-minutes: 35
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          SITE_REPO_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SEO_AUTOPUBLISH: ${{ vars.SEO_AUTOPUBLISH }}
          SEO_AUTOPUSH_FEECHECK: ${{ vars.SEO_AUTOPUSH_FEECHECK }}
          MAX_FEE_FIXES_PER_RUN: "10"
        run: npx tsx scripts/seo/fee-verify-agent.ts

      - name: Titles and meta descriptions
        if: always()
        run: npx tsx scripts/seo/title-meta-audit.ts

      - name: Accessibility audit
        if: always()
        run: npx tsx scripts/seo/accessibility-audit.ts

      # Same verification shape as the fee-range step above: checks run
      # concurrently via Promise.all, so the typical case is ~180s regardless
      # of MAX_MECHANICAL_FIXES_PER_RUN. 35 is a generous upper bound, capped
      # well short of the job's overall timeout-minutes so this step can't be
      # killed mid-verification with an unreverted commit already live.
      - name: Mechanical SEO fixes
        if: always()
        timeout-minutes: 35
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          SITE_REPO_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
          SEO_AUTOPUBLISH: ${{ vars.SEO_AUTOPUBLISH }}
          SEO_AUTOPUSH_MECHANICAL: ${{ vars.SEO_AUTOPUSH_MECHANICAL }}
          MAX_MECHANICAL_FIXES_PER_RUN: "10"
        run: npx tsx scripts/seo/mechanical-fix-agent.ts

      - name: Sitemap and robots.txt consistency
        if: always()
        run: npx tsx scripts/seo/sitemap-robots-audit.ts

      - name: E-E-A-T signals
        if: always()
        run: npx tsx scripts/seo/eeat-audit.ts

      - name: Canonical and indexability
        if: always()
        run: npx tsx scripts/seo/canonical-audit.ts

      # Same verification shape as the fee-range step above: checks run
      # concurrently via Promise.all, so the typical case is ~180s regardless
      # of MAX_SITEMAP_FIXES_PER_RUN=20. 65 is a generous upper bound (with a
      # small buffer) so this step can't be killed mid-loop with an
      # unreverted commit already live.
      - name: Sitemap entry corrections
        if: always()
        timeout-minutes: 65
        env:
          SITE_REPO_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
          SEO_AUTOPUBLISH: ${{ vars.SEO_AUTOPUBLISH }}
          SEO_AUTOPUSH_SITEMAP: ${{ vars.SEO_AUTOPUSH_SITEMAP }}
          MAX_SITEMAP_FIXES_PER_RUN: "20"
        run: npx tsx scripts/seo/sitemap-fix-agent.ts

      # Reads the shared crawl for alt and dimension coverage, then makes a
      # bounded HEAD pass over the distinct image URLs to weigh them, so it has
      # its own timeout in case a slow host stalls the size checks.
      - name: Image SEO
        if: always()
        timeout-minutes: 15
        run: npx tsx scripts/seo/image-seo.ts

      - name: Core Web Vitals
        if: always()
        timeout-minutes: 20
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: npx tsx scripts/seo/vitals.ts

      - name: CTR outliers
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: npx tsx scripts/seo/ctr-outliers.ts

      - name: Striking distance
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: npx tsx scripts/seo/striking-distance.ts

      - name: Content decay
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: npx tsx scripts/seo/content-decay.ts

      # Reads Search Console and the shared crawl, so it runs after the crawl
      # group has filled the cache.
      - name: Query-to-page mismatch
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: npx tsx scripts/seo/query-page-mismatch.ts

      # Derives its keyword list from Search Console, then reads the live SERP
      # through Serper. Dormant and exits clean when SERPER_API_KEY is unset, so
      # it is wired in now and starts working the night a key is added.
      - name: Competitor SERP tracker
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: npx tsx scripts/seo/serp-tracker.ts

      # Reads its own backlink snapshot from the committed reports directory and
      # writes the fresh one back, so it must run before the commit step. Dormant
      # and exits clean when BING_WEBMASTER_API_KEY is unset.
      - name: Backlink monitor
        if: always()
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: npx tsx scripts/seo/backlink-monitor.ts

      - name: Commit reports
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Commit before pulling. Rebase refuses to run with the reports
          # unstaged, and a push landing on master mid-run is normal.
          git add reports/
          if git diff --staged --quiet; then
            echo "No new reports."
            exit 0
          fi
          git commit -m "seo reports $(date +%Y-%m-%d) [skip ci]"
          # Another workflow (or a concurrent nightly) pushing to master between
          # our fetch and our push gets the push rejected. That is a race, not a
          # failure, so rebase onto whatever landed and try again a few times
          # with jittered backoff rather than emailing a red run over it.
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin master || true
            if git push origin master; then
              echo "Pushed reports on attempt ${attempt}."
              exit 0
            fi
            echo "Push attempt ${attempt} lost a race, retrying..."
            sleep $(( (RANDOM % 8) + 2 ))
          done
          echo "Could not push reports after 5 attempts."
          exit 1

      - name: Send digest
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npx tsx scripts/seo/notify.ts
