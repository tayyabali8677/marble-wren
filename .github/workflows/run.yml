name: Run

on:
  schedule:
    # Was every 6h (4x/day); cut to every 12h to bring Actions minutes back
    # under the free-tier monthly quota without exposing the repo publicly.
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      slugs:
        description: "Specific slugs (space-separated). Leave empty to run all."
        required: false
        default: ""
      unlisted:
        description: "Hide from catalogue? (yes/no)"
        required: false
        default: "no"

# Shared with SEO Nightly. Both workflows commit and push to master, so they
# take turns on one concurrency group rather than racing each other's push. A
# run that starts while the other is going waits for it to finish; nothing is
# cancelled, so no scrape or report cycle is thrown away.
concurrency:
  group: marble-wren-master-writes
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Discover new sources
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODEL: gemini-flash-lite-latest
          SLUGS: ${{ github.event.inputs.slugs }}
        if: github.event.inputs.slugs == '' || github.event_name == 'schedule'
        run: npx tsx scripts/discover.ts

      - name: Commit discovered sources back to repo
        if: github.event.inputs.slugs == '' || github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/sources.json
          if git diff --staged --quiet; then
            echo "No new sources discovered — sources.json unchanged."
            exit 0
          fi
          git commit -m "auto: add discovered scholarship sources [skip ci]"
          # SEO Nightly and later steps of this same run also push to master, so
          # a push landing between our fetch and push gets rejected. That is a
          # race, not a failure: rebase onto whatever landed and retry a few
          # times rather than killing the pipeline (and skipping Generate).
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin master || true
            if git push origin master; then
              echo "Pushed discovered sources on attempt ${attempt}."
              exit 0
            fi
            echo "Push attempt ${attempt} lost a race, retrying..."
            sleep $(( (RANDOM % 8) + 2 ))
          done
          echo "Could not push discovered sources after 5 attempts."
          exit 1

      - name: Scrape
        env:
          SLUGS: ${{ github.event.inputs.slugs }}
        run: |
          if [ -n "$SLUGS" ]; then
            for slug in $SLUGS; do
              npx tsx scripts/scrape-source.ts $slug
            done
          else
            npx tsx scripts/scrape-source.ts
          fi

      - name: Commit scraped files to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/scraped/
          if git diff --staged --quiet; then
            echo "No new scraped files to commit."
            exit 0
          fi
          git commit -m "auto: persist scraped source files [skip ci]"
          # Same race guard as above. This is the step that failed the 06:21 run
          # on a rejected push, which skipped Generate/Publish and shipped zero
          # scholarships for that cycle, so the retry matters most here.
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin master || true
            if git push origin master; then
              echo "Pushed scraped files on attempt ${attempt}."
              exit 0
            fi
            echo "Push attempt ${attempt} lost a race, retrying..."
            sleep $(( (RANDOM % 8) + 2 ))
          done
          echo "Could not push scraped files after 5 attempts."
          exit 1

      - name: Generate
        id: generate
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODEL: gemini-flash-lite-latest
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLUGS: ${{ github.event.inputs.slugs }}
        run: |
          if [ -n "$SLUGS" ]; then
            npx tsx scripts/generate-batch.ts $SLUGS --skip-existing
          else
            npx tsx scripts/generate-batch.ts --all --skip-existing
          fi

      - name: Publish
        if: hashFiles('scripts/generated-batch.json') != ''
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          UNLISTED: ${{ github.event.inputs.unlisted }}
        run: |
          FLAG=""
          if [ "$UNLISTED" = "yes" ]; then FLAG="--unlisted"; fi
          npx tsx scripts/publish.ts scripts/generated-batch.json $FLAG

      - name: Update ticker strip counts
        if: always()
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/update-ticker.ts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch-${{ github.run_number }}
          path: scripts/generated-batch.json
          retention-days: 30
