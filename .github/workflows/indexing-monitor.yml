name: Indexing Monitor

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  indexing:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci

      - name: Run indexing monitor
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: npx tsx scripts/seo/indexing-monitor.ts

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add reports/
          if git diff --staged --quiet; then
            echo "No new report."
          else
            git commit -m "indexing report $(date +%Y-%m-%d) [skip ci]"
            git push
          fi
