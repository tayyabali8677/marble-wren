name: Monthly Privatize

# marble-wren was made public on 2026-08-29 to unblock GitHub Actions after
# hitting the account's free 2,000 min/month limit (no payment method on
# file, so hitting the cap blocks every workflow in every private repo on
# the account, not just the one over quota). This flips it back to private
# on the 1st of each month, once the free quota has reset. If it gets
# blocked again later in the month, gh-billing-guard (a separate always-
# public watchdog repo — see its README) flips it back to public
# automatically, since a blocked marble-wren can't run a job to fix itself.
#
# This job only ever needs to run while marble-wren is already public, so
# it never hits the same bootstrap problem the watchdog exists to solve.

on:
  schedule:
    - cron: "11 3 1 * *"
  workflow_dispatch:

jobs:
  privatize:
    runs-on: ubuntu-latest
    steps:
      - name: Flip marble-wren back to private
        env:
          # SITE_REPO_TOKEN is scoped for pushing SEO auto-fixes to titans-abroad
          # (see seo-nightly.yml) and does not have admin rights on marble-wren
          # itself, which is why this step 404'd every time it ran. VISIBILITY_TOKEN
          # is the same PAT used by the pale-horizon-6 watchdog for this exact
          # operation and has the admin scope it needs.
          GH_TOKEN: ${{ secrets.VISIBILITY_TOKEN }}
        run: |
          gh repo edit tayyabali8677/marble-wren --visibility private --accept-visibility-change-consequences
